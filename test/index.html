<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live User Count Dashboard</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #2a2a72, #1b1b2f);
      color: #fff;
      overflow: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 380px;
      animation: fadeIn 1.2s ease-in-out;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 15px;
      background: linear-gradient(90deg, #00e1ff, #00ff87);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .live-indicator {
      width: 24px;
      height: 24px;
      background-color: #ff4444;
      border-radius: 50%;
      animation: blink 2s infinite;
      box-shadow: 
        0 0 10px rgba(255, 68, 68, 0.8),
        0 0 20px rgba(255, 100, 100, 0.6),
        0 0 30px rgba(255, 150, 150, 0.4);
    }

    #count {
      font-size: 3rem;
      font-weight: 600;
      color: #00ffb7;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    #count.pulse {
      animation: pulse 0.4s ease;
    }

    .user-list {
      text-align: left;
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.07);
      padding: 15px;
      border-radius: 12px;
      max-height: 200px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #00ffb7 rgba(255, 255, 255, 0.1);
    }

    .user-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.4s ease forwards;
    }

    .flag {
      font-size: 1.2rem;
    }

    .footer {
      margin-top: 25px;
      font-size: 0.9rem;
      color: #bbb;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <span class="live-indicator"></span>
      Live Users
    </h1>
    <div id="count">0</div>
    <!-- <div class="user-list" id="userList"></div> -->
    <div class="footer">Powered by Go + WebSockets + Redis ⚡</div>
  </div>

  <script>
    const countEl = document.getElementById("count");
    const userListEl = document.getElementById("userList");

    // Connect to your Go WebSocket server
    const socket = new WebSocket("wss://live-user-count-nl1j.onrender.com/ws?page_id=1");

    socket.onopen = () => console.log("✅ Connected");
    socket.onclose = () => console.log("❌ Disconnected");
    socket.onerror = (err) => console.error("WebSocket error:", err);

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);
      // Expected: { count: number, users: [{ country: "IN" }, { country: "US" }] }

      // Animate count
      countEl.textContent = data.count;
      countEl.classList.add("pulse");
      setTimeout(() => countEl.classList.remove("pulse"), 300);

      // Update user list
      userListEl.innerHTML = "";
      data.users?.forEach(user => {
        const item = document.createElement("div");
        item.classList.add("user-item");
        item.innerHTML = `<span class="flag">${getFlagEmoji(user.country)}</span> 
                          <span>${getCountryName(user.country)}</span>`;
        userListEl.appendChild(item);
      });
    };

    // Convert country code to emoji flag
    function getFlagEmoji(countryCode) {
      if (!countryCode) return "🏳️";
      const codePoints = countryCode
        .toUpperCase()
        .split("")
        .map(char => 127397 + char.charCodeAt());
      return String.fromCodePoint(...codePoints);
    }

    // Country name mapping
    function getCountryName(code) {
      const countries = {
        IN: "India",
        US: "United States",
        GB: "United Kingdom",
        CA: "Canada",
        DE: "Germany",
        AU: "Australia",
        BR: "Brazil",
        JP: "Japan",
        FR: "France",
        SG: "Singapore",
      };
      return countries[code] || "Unknown";
    }

  </script>
</body>
</html>
